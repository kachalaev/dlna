<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Архив</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="title-row">
        <h1>Архив</h1>
        <button id="rescan" type="button">Обновить каталог</button>
      </div>
      <p id="status" class="status">Каталог ещё не обновлялся</p>
      <form id="search-form" role="search">
        <input id="search" type="search" placeholder="Поиск по названию" autocomplete="off">
      </form>
    </header>
    <nav id="crumbs" class="crumbs" aria-label="Путь"></nav>
    <main id="listing"></main>
    <section id="player" class="player" hidden></section>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
